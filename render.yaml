services:
  - type: web
    name: manuscript-qc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 900 -b 0.0.0.0:$PORT app:app
    plan: 2c-4g
    healthCheckPath: /healthz
    disk:
      name: manuscript-qc-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JOURNAL_GUARD_DATA_DIR
        value: /var/data
      - key: JOURNAL_GUARD_UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: 1073741824
