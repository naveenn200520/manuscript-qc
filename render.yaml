services:
  - type: web
    name: manuscript-qc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --timeout 300 -b 0.0.0.0:$PORT app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
