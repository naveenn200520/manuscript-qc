services:
  - type: web
    name: manuscript-qc
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --timeout 120 app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
