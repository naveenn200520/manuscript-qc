{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-6xl font-black text-slate-200 mb-4">404</h1>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Page Not Found</h2>
        <p class="text-slate-500 mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('dashboard') }}" class="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium transition-colors shadow shadow-brand-500/20">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
