{% extends "base.html" %}

{% block title %}Login - Manuscript QC Platform{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1455390582262-044cdead2708?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80')] bg-cover bg-center">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
    
    <div class="glass-panel relative w-full max-w-md p-4 rounded-2xl shadow-2xl mx-4">
        <div class="text-center mb-4 flex flex-col items-center">
            <div class="flex items-center gap-3 justify-center mb-2">
                <img src="{{ url_for('static', filename='images/straive-logo.png') }}" alt="Straive Logo" class="h-12 object-contain">
                <h1 class="text-4xl font-extrabold text-[#ff5500] tracking-tight">
                    Straive
                </h1>
            </div>
            <p class="text-slate-500 mt-2 font-medium tracking-wide">JournalGuard</p>
        </div>



        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label for="login_id" class="block text-sm font-medium text-slate-700 mb-1">Employee ID or Email</label>
                <input type="text" id="login_id" name="login_id" required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors bg-white/50 focus:bg-white"
                    placeholder="EMP1234 or admin@qcplatform.com">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors bg-white/50 focus:bg-white"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg shadow-lg shadow-brand-500/30 transform transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
